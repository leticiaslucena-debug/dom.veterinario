<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Clínico</title>

    <link rel="stylesheet" href="clinico.css">
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Registro Clínico Veterinário</h1>

            <p class="subtitulo">
                Sistema de acompanhamento clínico do pet
            </p>

            <form action="" method="POST">


                 <div class="campo">
                    <label> ID do Registro Clínico</label>
                    <textarea name="id_clinico" id="id_clinico"></textarea>
                </div>
                
                <div class="campo">
                    <label>Queixa Principal</label>
                    <textarea name="queixa" id="queixa"></textarea>
                </div>

                <div class="campo">
                    <label>Histórico Clínico</label>
                    <textarea name="historico" id="historico"></textarea>
                </div>

                <div class="campo">
                    <label>Exames Realizados</label>
                    <textarea name="exames" id="exames"></textarea>
                </div>

                <div class="campo">
                    <label>Diagnóstico</label>
                    <textarea name="diagnostico" id="diagnostico"></textarea>
                </div>

                <div class="campo">
                    <label>Tratamento</label>
                    <textarea name="tratamento" id="tratamento"></textarea>
                </div>

                <div class="campo">
                    <label>Medicamentos</label>
                    <textarea name="medicamentos" id="medicamentos"></textarea>
                </div>

                <div class="campo grande">
                    <label>Observações</label>
                    <textarea name="observacoes" id="observacoes"></textarea>
                </div>

                <!-- ÁREA DE INTERNAÇÃO EMBAIXO -->
                <div class="menu-links">
                    <a href="internacao.html" class="link-internacao">
                        Área de Internação
                    </a>
                </div>

                <button type="submit">
                    Salvar Registro Clínico
                </button>

            </form>

        </div>

    </div>

    

</body>

</html>
