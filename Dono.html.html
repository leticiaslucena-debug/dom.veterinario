<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Tutor</title>
    <link rel="stylesheet" href="Dono.css.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="card-cadastro">

    <div class="icone">
        🐾
    </div>

    <h2 class="titulo">Cadastro de Tutor</h2>
    <p class="subtitulo">Cadastro do Dono do Pet</p>

    <form>

        <div class="mb-3">
            <label class="form-label">ID do Tutor</label>
            <input type="text" class="form-control" placeholder="Gerado automaticamente" readonly>
        </div>

        <div class="mb-3">
            <label class="form-label">Nome Completo</label>
            <input type="text" class="form-control" placeholder="Digite o nome completo">
        </div>

        <div class="mb-3">
            <label class="form-label">CPF</label>
            <input type="text" class="form-control" placeholder="000.000.000-00">
        </div>

        <div class="mb-3">
            <label class="form-label">Data de Nascimento</label>
            <input type="date" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Sexo</label>
            <select class="form-select">
                <option selected disabled>Selecione</option>
                <option>Masculino</option>
                <option>Feminino</option>
                <option>Outro</option>
                <option>Prefiro não informar</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">E-mail</label>
            <input type="email" class="form-control" placeholder="Digite seu e-mail">
        </div>

        <div class="mb-4">
            <label class="form-label">Senha</label>
            <input type="password" class="form-control" placeholder="Crie uma senha">
        </div>
<button type="submit" class="btn btn-cadastrar w-100">
    Cadastrar Tutor
</button>
    </form>

</div>

</body>
</html>
